name: CLEVE IA - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q cleve-ia-otc-smart-scanner-android.zip -d projeto

      - name: Instalar dependencias
        working-directory: projeto
        run: npm install

      - name: Compilar aplicacao
        working-directory: projeto
        run: npm run build

      - name: Sincronizar Capacitor
        working-directory: projeto
        run: npx cap sync android

      - name: Gerar APK
        working-directory: projeto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLEVE-IA-APK
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
